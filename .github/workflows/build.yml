name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-nix:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: build
        shell: nix develop -c bash -e {0}
        run: ./buildAll.sh

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-rtsp-server
          path-type: inherit

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup PKG_CONFIG
        shell: msys2 {0}
        run: |
          echo "PKG_CONFIG=$(cygpath -m /ucrt64/bin/pkg-config.exe)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(cygpath -m /ucrt64/lib/pkgconfig)" >> $GITHUB_ENV
          echo "CC=$(cygpath -m /ucrt64/bin/gcc.exe)" >> $GITHUB_ENV
          cygpath -w /ucrt64/bin >> $GITHUB_PATH

      - name: build
        run: ./buildAll.sh